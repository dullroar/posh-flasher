name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: powershell   # Windows PowerShell 5.1, the supported edition
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Settings .\PSScriptAnalyzerSettings.psd1
          $r | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize
          if ($r) { exit 1 }
      - name: Tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Test-Write-LinuxUsb.ps1
